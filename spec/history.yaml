entries:
  - version: "0.1.0"
    status: draft
    date: "2026-07-10"
    author: AI-архитектор
    summary: >
      Первоначальная спецификация: инструмент быстрого пересчёта сценариев
      бюджета строительных объектов на основе постановки и module-registry.
    changes:
      - Создана структура spec/ (13 YAML-файлов)
      - Сформулированы проблема, цель, роли, ограничения и риски
      - Определены сущности: объект, сценарий, денежный поток, финрезультат, формы, отчёты, пользователи
      - Сформулированы 14 требований (11 high, 3 medium) с acceptance criteria
      - Выбраны модули из registry (Tabulator, ECharts, forecast-*, FastAPI/React templates)
      - Добавлены 11 приёмочных тестов для high-требований
      - Зафиксированы gaps/assumptions и 6 архитектурных решений
    open_gaps:
      - GAP-003
    deferred_gaps:
      - GAP-001
      - GAP-002
      - GAP-004
      - GAP-005
      - GAP-006
